{% extends 'admin/base_admin.html' %}
{% block admin_title %}Ajouter un album{% endblock %}
{% block admin_title_top %}Ajouter un album{% endblock %}

{% block admin_content %}
<div class="admin-form-card">
  <form method="POST" class="admin-form">
    <div class="form-group">
      <label for="titre">Titre <span class="required">*</span></label>
      <input type="text" id="titre" name="titre" placeholder="Ex: Hackathon 2026" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="date">Date <span class="required">*</span></label>
        <input type="date" id="date" name="date" required>
      </div>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" placeholder="Description de l'album..."></textarea>
    </div>
    <div class="admin-form-actions">
      <a href="{{ url_for('admin_galerie') }}" class="btn-admin-outline">Annuler</a>
      <button type="submit" class="btn-admin-primary">➕ Créer l'album</button>
    </div>
  </form>
</div>
{% endblock %}
