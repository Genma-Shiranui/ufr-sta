{% extends 'admin/base_admin.html' %}
{% block admin_title %}Ajouter une formation{% endblock %}
{% block admin_title_top %}Ajouter une formation{% endblock %}

{% block admin_content %}
<div class="admin-form-card">
  <form method="POST" class="admin-form">
    <div class="form-row">
      <div class="form-group">
        <label for="nom">Nom <span class="required">*</span></label>
        <input type="text" id="nom" name="nom" placeholder="Ex: Licence Informatique" required>
      </div>
      <div class="form-group">
        <label for="niveau">Niveau</label>
        <select id="niveau" name="niveau">
          <option value="">-- Choisir --</option>
          <option value="Licence">Licence</option>
          <option value="Master">Master</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="duree">Durée</label>
        <input type="text" id="duree" name="duree" placeholder="Ex: 3 ans">
      </div>
      <div class="form-group">
        <label for="departement_id">Département</label>
        <select id="departement_id" name="departement_id">
          <option value="">-- Choisir --</option>
          {% for d in departements %}
          <option value="{{ d.id }}">{{ d.nom }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="conditions">Conditions d'admission</label>
      <textarea id="conditions" name="conditions" rows="3" placeholder="Baccalauréat série S..."></textarea>
    </div>
    <div class="form-group">
      <label for="debouches">Débouchés</label>
      <textarea id="debouches" name="debouches" rows="3" placeholder="Développeur, ingénieur..."></textarea>
    </div>
    <div class="admin-form-actions">
      <a href="{{ url_for('admin_formations') }}" class="btn-admin-outline">Annuler</a>
      <button type="submit" class="btn-admin-primary">➕ Ajouter la formation</button>
    </div>
  </form>
</div>
{% endblock %}
