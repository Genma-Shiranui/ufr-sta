{% extends 'admin/base_admin.html' %} {% block admin_title %}Ajouter une
activité{% endblock %} {% block admin_title_top %}Ajouter une activité{%
endblock %} {% block admin_content %}

<div class="admin-form-card">
  <form method="POST" class="admin-form">
    <div class="form-group">
      <label for="titre">Titre <span class="required">*</span></label>
      <input
        type="text"
        id="titre"
        name="titre"
        placeholder="Titre de l'activité"
        required
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="date">Date <span class="required">*</span></label>
        <input type="date" id="date" name="date" required />
      </div>
      <div class="form-group">
        <label for="lieu">Lieu</label>
        <input
          type="text"
          id="lieu"
          name="lieu"
          placeholder="ex: Salle Informatique"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="organisateur">Organisateur</label>
      <input
        type="text"
        id="organisateur"
        name="organisateur"
        placeholder="ex: Département Informatique"
      />
    </div>

    <div class="form-group">
      <label for="description"
        >Description complète <span class="required">*</span></label
      >
      <textarea
        id="description"
        name="description"
        rows="8"
        placeholder="Description détaillée de l'activité..."
        required
      ></textarea>
    </div>

    <div class="admin-form-actions">
      <a href="{{ url_for('admin_activites') }}" class="btn-admin-outline"
        >Annuler</a
      >
      <button type="submit" class="btn-admin-primary">
        ➕ Publier l'activité
      </button>
    </div>
  </form>
</div>

{% endblock %}
